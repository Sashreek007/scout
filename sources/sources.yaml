# Job sources scout polls. Verified working 2026-11-05. Checked by apps/pipeline/src/config/sources.ts.
github_lists:
  - name: simplify
    repo: SimplifyJobs/Summer2027-Internships
    path: .github/scripts/listings.json
    branch: dev
    fallback_branch: main
    term_field: terms
  - name: vansh
    repo: vanshb03/Summer2027-Internships
    path: .github/scripts/listings.json
    branch: dev
    fallback_branch: main
    term_field: season          # a season with no year, like "Summer"
    resolve_short_links: true   # its links are go.vansh.nyc short links
    certain_years:
      Summer: 2027              # this is the Summer 2027 list; other seasons' years aren't certain

ats_feeds:
  greenhouse: https://boards-api.greenhouse.io/v1/boards/{token}/jobs?content=true
  lever: https://api.lever.co/v0/postings/{token}?mode=json
  ashby: https://api.ashbyhq.com/posting-api/job-board/{token}?includeCompensation=true
